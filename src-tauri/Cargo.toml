[package]
name = "violin-adventure"
version = "1.0.0"
description = "Aplicación educativa para aprender violín"
authors = ["Vladimir Acuña"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "violin_adventure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
